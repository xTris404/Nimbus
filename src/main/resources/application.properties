spring.application.name=JWT_springboot3_nimbus
server.port=8005

spring.datasource.url=jdbc:mysql://localhost:3306/jwt_springboot3?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

## Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

## JWT (secret KHÔNG hardcode: đặt biến môi trường JWT_SECRET, tạo bằng: openssl rand -base64 48)
security.jwt.secret-key=${JWT_SECRET}
# 1h tính bằng milliseconds
security.jwt.expiration-time=3600000
security.jwt.issuer=jwt-demo
